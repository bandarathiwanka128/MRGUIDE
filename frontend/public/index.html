<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mr. Guide — Explore Sri Lanka with local guides</title>
    <meta
      name="description"
      content="Mr. Guide helps you discover Sri Lanka: search places, plan routes and multi-day trips, find authentic local experiences and book trusted local guides."
    />
    <meta name="theme-color" content="#0B1622" />
    <meta name="application-name" content="Mr. Guide" />
    <meta name="apple-mobile-web-app-title" content="Mr. Guide" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Mr. Guide — Explore Sri Lanka with local guides" />
    <meta property="og:description" content="Plan routes and trips, discover authentic places and book trusted local guides across Sri Lanka." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/brand/mrguide-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,500..700&family=Manrope:wght@400..800&display=swap"
    />

    <script>
      /* Apply the saved theme before first paint so there is no flash. */
      (function () {
        try {
          var t = localStorage.getItem('mrguide-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#F7F4EE' : '#0B1622');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to use Mr. Guide.</noscript>
    <div id="root"></div>
  </body>
</html>
