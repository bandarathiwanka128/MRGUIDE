services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mrguide-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://neondb_owner:npg_gt4v8hsEdzXe@ep-billowing-leaf-a1fvwa7a-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=your_jwt_secret_change_in_production
      - CORS_ORIGIN=http://localhost:3000
      - GEMINI_API_KEY=AIzaSyAyHtUJqq2_a2KIDG-gh6QwKiXgXbfs5uc
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mrguide-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
      - REACT_APP_GOOGLE_MAPS_API_KEY=AIzaSyDKQmKH9sEMretHWkYag0FMg7VFCNRNC_8
      - GENERATE_SOURCEMAP=false
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

networks:
  default:
    name: mrguide-network
