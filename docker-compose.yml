services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mrguide-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    # Secrets (DATABASE_URL, JWT_SECRET, STRIPE_SECRET_KEY, AI keys) come from
    # backend/.env, which is gitignored — never hardcode them in this file.
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mrguide-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
      - REACT_APP_SOCKET_URL=http://localhost:3001
      - REACT_APP_GOOGLE_MAPS_API_KEY=AIzaSyDKQmKH9sEMretHWkYag0FMg7VFCNRNC_8
      - GENERATE_SOURCEMAP=false
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

networks:
  default:
    name: mrguide-network
